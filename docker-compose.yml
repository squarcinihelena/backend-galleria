version: '3.8'

services:
  postgres-db:
    image: postgres:15
    container_name: galleria-postgres
    restart: always
    environment:
      POSTGRES_DB: galleriadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: