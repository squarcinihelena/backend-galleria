version: '3.8'

services:
  postgres-db:
    image: postgres:15
    container_name: galleria-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-galleriadb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: